<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Bihar Sand Challan QR Scanner</title>

<!-- QR SCANNER LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


<style>

/* ==============================
   BASIC
============================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:12px;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f5f4;
    color:#222;
}

.container{
    width:100%;
    max-width:650px;
    margin:auto;
}


/* ==============================
   HEADER
============================== */

.header{
    text-align:center;
    margin-bottom:10px;
}

.header h1{
    margin:5px 0;
    color:#176b3a;
    font-size:25px;
}

.header p{
    margin:5px 0;
    color:#555;
}


/* ==============================
   CAMERA BOX
============================== */

.camera-card{
    background:#000;
    border-radius:15px;
    overflow:hidden;
    position:relative;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

#reader{
    width:100%;
    min-height:320px;
}


/* ==============================
   STATUS
============================== */

.status{
    margin:12px 0;
    padding:13px;
    border-radius:9px;
    background:#e9eceb;
    text-align:center;
    font-weight:bold;
}

.status.success{
    background:#d8f5df;
    color:#126b2d;
}

.status.error{
    background:#ffe0e0;
    color:#a00000;
}

.status.warning{
    background:#fff2cc;
    color:#795900;
}


/* ==============================
   BUTTONS
============================== */

.controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin:10px 0;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 17px;
    background:#176b3a;
    color:white;
    font-size:15px;
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

button.secondary{
    background:#555;
}

button.danger{
    background:#a00000;
}

button:disabled{
    opacity:.5;
}


/* ==============================
   RESULT
============================== */

.result-card{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-top:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.result-title{
    font-weight:bold;
    color:#176b3a;
    margin-bottom:8px;
}

#result{
    word-break:break-all;
    font-size:14px;
    line-height:1.5;
}

.open-link{
    display:inline-block;
    margin-top:12px;
    padding:10px 15px;
    background:#176b3a;
    color:white;
    text-decoration:none;
    border-radius:7px;
}


/* ==============================
   OTHER OPTIONS
============================== */

.option-card{
    background:white;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.option-card h3{
    margin-top:0;
}

input[type="text"]{
    width:100%;
    padding:13px;
    border:1px solid #aaa;
    border-radius:7px;
    font-size:16px;
    outline:none;
}

input[type="text"]:focus{
    border-color:#176b3a;
}

input[type="file"]{
    width:100%;
    padding:10px 0;
}


/* ==============================
   CAMERA SELECT
============================== */

#cameraSelect{
    width:100%;
    padding:11px;
    border-radius:7px;
    border:1px solid #aaa;
    background:white;
    margin-top:8px;
}


/* ==============================
   SMALL TEXT
============================== */

.small{
    text-align:center;
    color:#777;
    font-size:12px;
    margin:18px 0;
}

</style>

</head>


<body>


<div class="container">


<!-- ==============================
     HEADER
============================== -->

<div class="header">

<h1>🚚 Bihar Sand Challan</h1>

<p>📷 QR Code Scan Kijiye</p>

</div>


<!-- ==============================
     CAMERA
============================== -->

<div class="camera-card">

<div id="reader"></div>

</div>


<!-- ==============================
     STATUS
============================== -->

<div
    id="status"
    class="status"
>
📷 Camera start ho raha hai...
</div>


<!-- ==============================
     CAMERA CONTROLS
============================== -->

<div class="controls">

<button
    id="startBtn"
    onclick="startScanner()"
>
▶️ Start Camera
</button>

<button
    id="stopBtn"
    class="danger"
    onclick="stopScanner()"
>
⏹️ Stop
</button>

<button
    id="torchBtn"
    class="secondary"
    onclick="toggleTorch()"
    style="display:none"
>
🔦 Torch
</button>

</div>


<!-- ==============================
     CAMERA SELECT
============================== -->

<div class="option-card">

<b>📷 Camera</b>

<select
    id="cameraSelect"
    onchange="changeCamera()"
>
<option value="">
Camera select karein
</option>
</select>

</div>


<!-- ==============================
     RESULT
============================== -->

<div class="result-card">

<div class="result-title">
✅ Scan Result
</div>

<div id="result">
QR scan hone ke baad URL yahan dikhega.
</div>

</div>


<!-- ==============================
     PHOTO SCAN
============================== -->

<div class="option-card">

<h3>🖼️ QR Photo Se Scan</h3>

<p>
QR ki clear photo select karein.
</p>

<input
    type="file"
    id="qrImage"
    accept="image/*"
>

</div>


<!-- ==============================
     MANUAL URL
============================== -->

<div class="option-card">

<h3>🔗 Manual URL</h3>

<input
    type="text"
    id="manualUrl"
    placeholder="QR URL yahan paste karein"
>

<div class="controls">

<button onclick="manualSubmit()">
Submit URL
</button>

</div>

</div>


<div class="small">
Bihar Sand Challan QR Scanner
</div>


</div>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT URL
   ===================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwhAG6me0_QyMPKBTVRu_hpzFkrWXRbHR_1RQgNIGvq3Vx7SHSree91OR0BICZU5TBN/exec";


/* =====================================================
   GLOBAL VARIABLES
   ===================================================== */

let html5QrCode = null;

let cameras = [];

let currentCameraId = null;

let scannerRunning = false;

let scanLocked = false;

let lastScannedText = "";

let torchOn = false;


/* =====================================================
   DOM
   ===================================================== */

const statusBox =
    document.getElementById("status");

const resultBox =
    document.getElementById("result");

const cameraSelect =
    document.getElementById("cameraSelect");

const startButton =
    document.getElementById("startBtn");

const stopButton =
    document.getElementById("stopBtn");

const torchButton =
    document.getElementById("torchBtn");


/* =====================================================
   STATUS
   ===================================================== */

function setStatus(
    message,
    type=""
){

    statusBox.className =
        "status";

    if(type){
        statusBox.classList.add(type);
    }

    statusBox.innerText =
        message;
}


/* =====================================================
   RESULT
   ===================================================== */

function showResult(url){

    let html =
        "<b>QR Data:</b><br><br>" +
        escapeHTML(url);


    /*
       Agar QR data URL hai,
       to OPEN button dikhao.
    */

    if(
        url.startsWith("http://") ||
        url.startsWith("https://")
    ){

        html +=
            "<br><br>" +
            "<a class='open-link' " +
            "href='" +
            encodeURI(url) +
            "' target='_blank'>" +
            "🔗 Open QR Link" +
            "</a>";
    }


    resultBox.innerHTML =
        html;
}


/* =====================================================
   HTML ESCAPE
   ===================================================== */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   BEEP
   ===================================================== */

function beep(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const audio =
            new AudioContext();

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();

        oscillator.frequency.value =
            900;

        oscillator.type =
            "sine";

        gain.gain.value =
            0.08;

        oscillator.connect(gain);

        gain.connect(audio.destination);

        oscillator.start();

        oscillator.stop(
            audio.currentTime + 0.12
        );

    }catch(e){

        console.log(
            "Beep unavailable"
        );
    }

}


/* =====================================================
   VIBRATION
   ===================================================== */

function vibrate(){

    if(
        navigator.vibrate
    ){

        navigator.vibrate(
            [100,50,100]
        );

    }

}


/* =====================================================
   SAVE TO GOOGLE SHEET
   ===================================================== */

function saveToGoogleSheet(url){

    if(!url){

        return;
    }


    /*
       IMPORTANT:
       Apps Script URL unchanged.
    */

    const finalURL =
        APPS_SCRIPT_URL +
        "?url=" +
        encodeURIComponent(url);


    /*
       Hidden iframe.
       No CORS issue.
    */

    const iframe =
        document.createElement("iframe");


    iframe.style.display =
        "none";


    iframe.src =
        finalURL;


    document.body.appendChild(
        iframe
    );


    setTimeout(
        function(){

            iframe.remove();

        },
        5000
    );

}


/* =====================================================
   QR SUCCESS
   ===================================================== */

function onScanSuccess(
    decodedText,
    decodedResult
){

    if(
        !decodedText
    ){

        return;
    }


    /*
       Duplicate protection.
    */

    if(scanLocked){

        return;
    }


    scanLocked =
        true;


    lastScannedText =
        decodedText;


    /*
       Success sound.
    */

    beep();


    /*
       Vibration.
    */

    vibrate();


    /*
       Show result.
    */

    showResult(
        decodedText
    );


    /*
       Status.
    */

    setStatus(
        "✅ QR Scan Successful — Google Sheet me save ho raha hai...",
        "success"
    );


    /*
       Google Sheet.
    */

    saveToGoogleSheet(
        decodedText
    );


    /*
       2 second lock.
    */

    setTimeout(
        function(){

            scanLocked =
                false;


            setStatus(
                "📷 Next QR Code scan kijiye..."
            );

        },
        2000
    );

}


/* =====================================================
   SCAN ERROR
   ===================================================== */

function onScanFailure(
    errorMessage
){

    /*
       Normal scan failures
       continuously occur.
       Isliye UI me nahi dikhate.
    */

}


/* =====================================================
   GET CAMERAS
   ===================================================== */

async function getCameraList(){

    try{

        cameras =
            await Html5Qrcode.getCameras();


        if(
            !cameras ||
            cameras.length === 0
        ){

            setStatus(
                "❌ Camera nahi mila.",
                "error"
            );

            return;
        }


        /*
           Remove old options.
        */

        cameraSelect.innerHTML =
            "";


        /*
           Add cameras.
        */

        cameras.forEach(
            function(camera,index){

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    camera.id;


                option.textContent =
                    camera.label ||
                    "Camera " +
                    (index + 1);


                cameraSelect.appendChild(
                    option
                );

            }
        );


        /*
           Prefer back camera.
        */

        let backCamera =
            cameras.find(
                function(camera){

                    const label =
                        (
                            camera.label ||
                            ""
                        ).toLowerCase();


                    return(
                        label.includes("back") ||
                        label.includes("rear") ||
                        label.includes("environment")
                    );

                }
            );


        if(backCamera){

            currentCameraId =
                backCamera.id;

        }else{

            currentCameraId =
                cameras[
                    cameras.length - 1
                ].id;

        }


        cameraSelect.value =
            currentCameraId;


    }catch(error){

        console.error(error);

        setStatus(
            "❌ Camera list nahi mil rahi.",
            "error"
        );

    }

}


/* =====================================================
   START CAMERA
   ===================================================== */

async function startScanner(){

    if(
        scannerRunning
    ){

        return;
    }


    setStatus(
        "📷 Camera permission/check ho raha hai..."
    );


    try{

        /*
           Create scanner.
        */

        if(
            !html5QrCode
        ){

            html5QrCode =
                new Html5Qrcode(
                    "reader"
                );

        }


        /*
           Agar camera list nahi hai,
           pehle get cameras.
        */

        if(
            cameras.length === 0
        ){

            await getCameraList();

        }


        /*
           If camera ID available,
           use it.
        */

        let cameraConfig;


        if(
            currentCameraId
        ){

            cameraConfig = {
                deviceId:{
                    exact:
                        currentCameraId
                }
            };

        }else{

            /*
               Fallback.
            */

            cameraConfig = {
                facingMode:
                    "environment"
            };

        }


        /*
           ADVANCED CONFIG
        */

        const config = {

            /*
               20 FPS stable.
               30 FPS every device par
               better nahi hota.
            */

            fps:20,


            /*
               Dynamic QR box.
            */

            qrbox:function(
                width,
                height
            ){

                const minEdge =
                    Math.min(
                        width,
                        height
                    );


                /*
                   70% scanning area.
                */

                const size =
                    Math.floor(
                        minEdge * 0.70
                    );


                return{
                    width:size,
                    height:size
                };

            },


            /*
               QR only.
            */

            formatsToSupport:[
                Html5QrcodeSupportedFormats.QR_CODE
            ],


            /*
               16:9 camera.
            */

            aspectRatio:
                1.7777778,


            /*
               Do not flip.
            */

            disableFlip:true,


            /*
               Native BarcodeDetector
               where supported.
            */

            experimentalFeatures:{
                useBarCodeDetectorIfSupported:true
            }

        };


        /*
           START
        */

        await html5QrCode.start(

            cameraConfig,

            config,

            onScanSuccess,

            onScanFailure

        );


        scannerRunning =
            true;


        startButton.disabled =
            true;


        stopButton.disabled =
            false;


        setStatus(
            "📷 Camera Ready — QR ko box ke andar rakhein."
        );


        /*
           Torch support check.
        */

        checkTorch();


    }catch(error){

        console.error(
            "Camera start error:",
            error
        );


        /*
           Fallback:
           environment camera.
        */

        try{

            await html5QrCode.start(

                {
                    facingMode:
                        "environment"
                },

                {
                    fps:20,

                    qrbox:250,

                    formatsToSupport:[
                        Html5QrcodeSupportedFormats.QR_CODE
                    ],

                    disableFlip:true
                },

                onScanSuccess,

                onScanFailure

            );


            scannerRunning =
                true;


            startButton.disabled =
                true;


            setStatus(
                "📷 Camera Ready — QR scan kijiye."
            );


            checkTorch();


        }catch(error2){

            console.error(
                "Fallback camera error:",
                error2
            );


            scannerRunning =
                false;


            startButton.disabled =
                false;


            setStatus(
                "❌ Camera start nahi hua. Camera permission allow karein.",
                "error"
            );

        }

    }

}


/* =====================================================
   STOP CAMERA
   ===================================================== */

async function stopScanner(){

    if(
        !html5QrCode ||
        !scannerRunning
    ){

        return;
    }


    try{

        await html5QrCode.stop();


        scannerRunning =
            false;


        startButton.disabled =
            false;


        stopButton.disabled =
            true;


        torchButton.style.display =
            "none";


        setStatus(
            "⏹️ Camera stopped."
        );


    }catch(error){

        console.error(
            "Stop error:",
            error
        );

    }

}


/* =====================================================
   CHANGE CAMERA
   ===================================================== */

async function changeCamera(){

    const newCamera =
        cameraSelect.value;


    if(
        !newCamera
    ){

        return;
    }


    currentCameraId =
        newCamera;


    /*
       Stop current.
    */

    if(
        scannerRunning
    ){

        await stopScanner();

    }


    /*
       Start selected camera.
    */

    await startScanner();

}


/* =====================================================
   TORCH
===================================================== */

async function checkTorch(){

    try{

        const capabilities =
            await html5QrCode
                .getRunningTrackCapabilities();


        if(
            capabilities &&
            capabilities.torch
        ){

            torchButton.style.display =
                "inline-block";

        }else{

            torchButton.style.display =
                "none";

        }

    }catch(error){

        torchButton.style.display =
            "none";

    }

}


/* =====================================================
   TOGGLE TORCH
===================================================== */

async function toggleTorch(){

    if(
        !html5QrCode ||
        !scannerRunning
    ){

        return;
    }


    try{

        torchOn =
            !torchOn;


        await html5QrCode.applyVideoConstraints({

            advanced:[
                {
                    torch:
                        torchOn
                }
            ]

        });


        torchButton.innerText =
            torchOn
            ? "🔦 Torch OFF"
            : "🔦 Torch ON";


    }catch(error){

        console.error(
            "Torch error:",
            error
        );


        setStatus(
            "⚠️ Is camera me Torch support nahi hai.",
            "warning"
        );

    }

}


/* =====================================================
   PHOTO SCAN
   ===================================================== */

document
.getElementById("qrImage")
.addEventListener(
    "change",
    async function(event){

        const file =
            event.target.files[0];


        if(!file){

            return;
        }


        setStatus(
            "🔍 QR photo scan ho rahi hai..."
        );


        /*
           Separate scanner.
        */

        const imageScanner =
            new Html5Qrcode(
                "reader"
            );


        try{

            const decodedText =
                await imageScanner.scanFile(
                    file,
                    true
                );


            showResult(
                decodedText
            );


            setStatus(
                "✅ Photo se QR successfully read ho gaya!",
                "success"
            );


            beep();

            vibrate();


            saveToGoogleSheet(
                decodedText
            );


        }catch(error){

            console.error(
                "Image scan error:",
                error
            );


            setStatus(
                "❌ Photo me QR detect nahi hua. Clear QR photo try karein.",
                "error"
            );

        }


        try{

            await imageScanner.clear();

        }catch(e){}

    }
);


/* =====================================================
   MANUAL URL
   ===================================================== */

function manualSubmit(){

    const input =
        document.getElementById(
            "manualUrl"
        );


    const url =
        input.value.trim();


    if(!url){

        setStatus(
            "⚠️ QR URL paste kijiye.",
            "warning"
        );

        return;
    }


    showResult(
        url
    );


    setStatus(
        "✅ Manual URL Google Sheet me save ho raha hai...",
        "success"
    );


    saveToGoogleSheet(
        url
    );


    input.value =
        "";

}


/* =====================================================
   PAGE LOAD
   ===================================================== */

window.addEventListener(
    "load",
    async function(){

        /*
           First create scanner.
        */

        html5QrCode =
            new Html5Qrcode(
                "reader"
            );


        /*
           Automatically start.
        */

        await startScanner();

    }
);


/* =====================================================
   PAGE CLOSE
   ===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        if(
            html5QrCode &&
            scannerRunning
        ){

            html5QrCode
                .stop()
                .catch(
                    function(){}
                );

        }

    }
);

</script>

</body>
</html>
