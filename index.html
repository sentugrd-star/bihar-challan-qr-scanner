<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Bihar Sand Challan QR Scanner</title>

<!-- ZXing Browser -->
<script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:12px;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f5f4;
    color:#222;
}

.container{
    width:100%;
    max-width:650px;
    margin:auto;
}

h1{
    text-align:center;
    color:#176b3a;
    font-size:25px;
    margin:8px 0;
}

.subtitle{
    text-align:center;
    color:#555;
    margin-bottom:12px;
}


/* CAMERA */

.camera-box{
    width:100%;
    background:#000;
    border-radius:15px;
    overflow:hidden;
    position:relative;
}

#video{
    display:block;
    width:100%;
    height:360px;
    object-fit:cover;
    background:#000;
}


/* SCAN FRAME */

.scan-frame{
    position:absolute;
    width:65%;
    aspect-ratio:1/1;
    left:17.5%;
    top:50%;
    transform:translateY(-50%);
    border:3px solid #00ff66;
    border-radius:12px;
    pointer-events:none;
}


/* STATUS */

.status{
    margin:12px 0;
    padding:14px;
    text-align:center;
    border-radius:9px;
    background:#e9eceb;
    font-weight:bold;
    font-size:16px;
    word-break:break-word;
}

.success{
    background:#d9f5df;
    color:#126b2d;
}

.error{
    background:#ffe0e0;
    color:#a00000;
}

.warning{
    background:#fff0c2;
    color:#765700;
}


/* BUTTONS */

.controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin:12px 0;
}

button{
    border:0;
    border-radius:8px;
    padding:13px 18px;
    background:#176b3a;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

button.danger{
    background:#a00000;
}

button.secondary{
    background:#555;
}

button:disabled{
    opacity:.5;
}


/* CARD */

.card{
    background:white;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h3{
    margin-top:0;
    color:#176b3a;
}


/* RESULT */

#result{
    word-break:break-all;
    line-height:1.5;
    font-size:15px;
}

.open-link{
    display:inline-block;
    margin-top:12px;
    padding:10px 15px;
    background:#176b3a;
    color:white;
    text-decoration:none;
    border-radius:7px;
}


/* INPUT */

input[type=text]{
    width:100%;
    padding:13px;
    border:1px solid #999;
    border-radius:8px;
    font-size:16px;
}

input[type=file]{
    width:100%;
    padding:8px 0;
}

.small{
    text-align:center;
    color:#777;
    font-size:13px;
    margin:18px 0;
}

</style>

</head>


<body>

<div class="container">


<h1>🚚 Bihar Sand Challan</h1>

<div class="subtitle">
📷 Fast QR Scanner
</div>


<!-- CAMERA -->

<div class="camera-box">

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>

    <div class="scan-frame"></div>

</div>


<!-- STATUS -->

<div
    id="status"
    class="status">

📷 Start Camera dabayein.

</div>


<!-- BUTTONS -->

<div class="controls">

<button
    id="startBtn"
    onclick="startScanner()">

▶️ Start Camera

</button>


<button
    id="stopBtn"
    class="danger"
    onclick="stopScanner()"
    disabled>

⏹️ Stop

</button>


<button
    id="torchBtn"
    class="secondary"
    onclick="toggleTorch()"
    style="display:none">

🔦 Torch ON

</button>

</div>


<!-- RESULT -->

<div class="card">

<h3>
✅ Scan Result
</h3>

<div id="result">

QR scan hone ke baad URL yahan dikhega.

</div>

</div>


<!-- PHOTO QR -->

<div class="card">

<h3>
🖼️ QR Photo Se Scan
</h3>

<p>
QR ki clear photo select karein.
</p>

<input
    type="file"
    id="qrImage"
    accept="image/*">

</div>


<!-- MANUAL -->

<div class="card">

<h3>
🔗 Manual URL
</h3>

<input
    type="text"
    id="manualUrl"
    placeholder="QR URL yahan paste karein">

<div class="controls">

<button
    onclick="manualSubmit()">

Submit URL

</button>

</div>

</div>


<div class="small">
Bihar Sand Challan QR Scanner
</div>


</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT
===================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwhAG6me0_QyMPKBTVRu_hpzFkrWXRbHR_1RQgNlGvq3Vx7SHSree91OR0BiCZU5TBN/exec";


/* =====================================================
   VARIABLES
===================================================== */

let codeReader = null;
let controls = null;
let scannerRunning = false;
let scanLocked = false;
let lastQR = "";
let lastScannedText = "";
let lastScanTime = 0;
let torchOn = false;

/* =====================================================
   ELEMENTS
===================================================== */

const video =
document.getElementById("video");

const statusBox =
document.getElementById("status");

const resultBox =
document.getElementById("result");

const startBtn =
document.getElementById("startBtn");

const stopBtn =
document.getElementById("stopBtn");

const torchBtn =
document.getElementById("torchBtn");


/* =====================================================
   STATUS
===================================================== */

function setStatus(text,type=""){

    statusBox.className =
        "status " + type;

    statusBox.innerText =
        text;

}


/* =====================================================
   RESULT
===================================================== */

function showResult(text){

    const safe =
        String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");

    let html =
        "<b>QR Data:</b><br><br>" +
        safe;

    if(/^https?:\/\//i.test(text)){

        html +=
            "<br><br>" +

            "<a class='open-link' " +

            "href='" +
            encodeURI(text) +
            "' " +

            "target='_blank'>" +

            "🔗 Open QR Link" +

            "</a>";
    }

    resultBox.innerHTML =
        html;

}


/* =====================================================
   BEEP
===================================================== */

function beep(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext) return;

        const audio =
            new AudioContext();

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();

        oscillator.frequency.value =
            1000;

        gain.gain.value =
            0.08;

        oscillator.connect(gain);

        gain.connect(
            audio.destination
        );

        oscillator.start();

        oscillator.stop(
            audio.currentTime + 0.12
        );

    }catch(e){}

}


/* =====================================================
   VIBRATION
===================================================== */

function vibrate(){

    try{

        if(navigator.vibrate){

            navigator.vibrate(
                [80,40,80]
            );

        }

    }catch(e){}

}


/* =====================================================
   GOOGLE SHEET SAVE
===================================================== */

// =====================================================
// GOOGLE SHEET QUEUE - NO QR ENTRY LOST
// =====================================================

const SAVE_QUEUE_KEY = "bihar_qr_save_queue";

let saveQueue = [];
let savingNow = false;

// Load pending data
try {
    saveQueue =
        JSON.parse(
            localStorage.getItem(SAVE_QUEUE_KEY) || "[]"
        );
} catch (e) {
    saveQueue = [];
}


// Save queue
function saveQueueToStorage() {

    try {

        localStorage.setItem(
            SAVE_QUEUE_KEY,
            JSON.stringify(saveQueue)
        );

    } catch (e) {}

}


// Add QR to queue
function saveToGoogleSheet(value) {

    if (!value) {
        return;
    }

    saveQueue.push({
        url: value,
        time: Date.now()
    });

    saveQueueToStorage();

    processSaveQueue();

}


// Process ONE QR at a time
function processSaveQueue() {

    if (savingNow) {
        return;
    }

    if (saveQueue.length === 0) {
        return;
    }

    savingNow = true;

    const item = saveQueue[0];

    const requestURL =
        APPS_SCRIPT_URL +
        "?url=" +
        encodeURIComponent(item.url);

    const img =
        new Image();

    let finished = false;

    function finish() {

        if (finished) {
            return;
        }

        finished = true;

        img.onload = null;
        img.onerror = null;

        // Remove saved item
        saveQueue.shift();

        saveQueueToStorage();

        savingNow = false;

        // Small gap before next QR
        setTimeout(
            processSaveQueue,
            250
        );

    }

    img.onload = function () {

        finish();

    };

    img.onerror = function () {

        // Google Apps Script redirect/network
        // can sometimes trigger onerror even when request
        // reaches the server. Retry after delay.

        savingNow = false;

        setTimeout(
            processSaveQueue,
            1500
        );

    };

    img.src =
        requestURL;

    // Safety timeout
    setTimeout(
        function () {

            if (!finished) {

                finish();

            }

        },
        5000
    );

}


// Retry pending QR when page opens
window.addEventListener(
    "load",
    function () {

        setTimeout(
            processSaveQueue,
            1000
        );

    }
);
      
/* =====================================================
   QR SUCCESS
===================================================== */
function onQRSuccess(result) {

    if (!result || !result.text) {
        return;
    }

    const text =
        result.text.trim();

    if (!text) {
        return;
    }

    // Same QR को दोबारा तुरंत scan होने से रोकें
    if (text === lastScannedText) {
        return;
    }

    lastScannedText = text;

    // Result दिखाएँ
    showResult(text);

    // Sound
    beep();

    // Vibration
    vibrate();

    // Google Sheet Queue
    saveToGoogleSheet(text);

    // 1.5 sec बाद next QR allow
    setTimeout(
        function () {

            lastScannedText = "";

        },
        1500
    );

}

    setStatus(
        "✅ QR Scan Successful — Google Sheet me save ho raha hai.",
        "success"
    );

    /*
       Camera chalta rahega.
    */

    setTimeout(function(){

        scanLocked = false;

        setStatus(
            "📷 Next QR Code scan kijiye."
        );

    },1000);

}


/* =====================================================
   START CAMERA
===================================================== */

async function startScanner(){

    if(scannerRunning){

        return;

    }

    try{

        if(
            !window.ZXingBrowser
        ){

            throw new Error(
                "ZXing library load nahi hui."
            );

        }

        setStatus(
            "📷 Rear camera start ho raha hai..."
        );

        startBtn.disabled =
            true;


        /*
           ZXing QR reader
        */

        if(!codeReader){

            codeReader =
                new ZXingBrowser
                .BrowserQRCodeReader();

        }


        /*
           IMPORTANT:
           Direct environment camera.
           Camera dropdown nahi hai.
        */

        const constraints = {

            video:{

                facingMode:{
                    ideal:"environment"
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                },

                frameRate:{
                    ideal:30,
                    max:30
                }

            },

            audio:false

        };


        /*
           Start continuous QR scanning
        */

        controls =
            await codeReader
            .decodeFromConstraints(

                constraints,

                video,

                function(
                    result,
                    error
                ){

                    if(result){

                        onQRSuccess(
                            result
                        );

                    }

                }

            );


        try{

            await video.play();

        }catch(e){}


        scannerRunning =
            true;

        stopBtn.disabled =
            false;

        setStatus(
            "📷 Rear Camera Ready — QR ko green box ke andar rakhein.",
            "success"
        );

        checkTorch();


    }catch(error){

        console.error(
            "CAMERA ERROR:",
            error
        );

        scannerRunning =
            false;

        startBtn.disabled =
            false;

        stopBtn.disabled =
            true;

        let message =
            error &&
            error.message
            ? error.message
            : String(error);

        setStatus(
            "❌ Camera Error: " +
            message,
            "error"
        );

    }

}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopScanner(){

    try{

        if(
            controls &&
            typeof controls.stop ===
            "function"
        ){

            controls.stop();

        }

    }catch(e){

        console.error(e);

    }


    try{

        if(codeReader){

            codeReader.reset();

        }

    }catch(e){}


    /*
       Extra safety
    */

    try{

        if(video.srcObject){

            video.srcObject
                .getTracks()
                .forEach(function(track){

                    track.stop();

                });

            video.srcObject =
                null;

        }

    }catch(e){}


    controls =
        null;

    scannerRunning =
        false;

    torchOn =
        false;

    startBtn.disabled =
        false;

    stopBtn.disabled =
        true;

    torchBtn.style.display =
        "none";

    setStatus(
        "⏹️ Camera stopped."
    );

}


/* =====================================================
   TORCH CHECK
===================================================== */

function checkTorch(){

    try{

        const stream =
            video.srcObject;

        if(!stream) return;

        const track =
            stream.getVideoTracks()[0];

        if(!track) return;

        const capabilities =
            track.getCapabilities();

        if(
            capabilities &&
            capabilities.torch
        ){

            torchBtn.style.display =
                "inline-block";

        }

    }catch(e){}

}


/* =====================================================
   TORCH
===================================================== */

async function toggleTorch(){

    try{

        const stream =
            video.srcObject;

        if(!stream) return;

        const track =
            stream.getVideoTracks()[0];

        if(!track) return;

        const capabilities =
            track.getCapabilities();

        if(
            !capabilities ||
            !capabilities.torch
        ){

            setStatus(
                "⚠️ Is camera me Torch support nahi hai.",
                "warning"
            );

            return;

        }

        torchOn =
            !torchOn;

        await track.applyConstraints({

            advanced:[
                {
                    torch:
                        torchOn
                }
            ]

        });

        torchBtn.innerText =
            torchOn
            ? "🔦 Torch OFF"
            : "🔦 Torch ON";

    }catch(error){

        console.error(
            "Torch error:",
            error
        );

        torchOn =
            false;

        setStatus(
            "⚠️ Torch support nahi hai.",
            "warning"
        );

    }

}


/* =====================================================
   PHOTO QR SCAN
===================================================== */

document
.getElementById("qrImage")
.addEventListener(
    "change",
    async function(event){

        const file =
            event.target.files[0];

        if(!file) return;

        setStatus(
            "🔍 Photo se QR scan ho raha hai..."
        );

        try{

            if(!codeReader){

                codeReader =
                    new ZXingBrowser
                    .BrowserQRCodeReader();

            }

            const imageURL =
                URL.createObjectURL(
                    file
                );

            const result =
                await codeReader
                .decodeFromImageUrl(
                    imageURL
                );

            URL.revokeObjectURL(
                imageURL
            );

            if(result){

                onQRSuccess(
                    result
                );

            }

        }catch(error){

            console.error(
                "PHOTO QR ERROR:",
                error
            );

            setStatus(
                "❌ Photo me QR detect nahi hua. Clear QR photo try karein.",
                "error"
            );

        }

    }
);


/* =====================================================
   MANUAL URL
===================================================== */

function manualSubmit(){

    const input =
        document.getElementById(
            "manualUrl"
        );

    const value =
        input.value.trim();

    if(!value){

        setStatus(
            "⚠️ QR URL paste kijiye.",
            "warning"
        );

        return;

    }

    showResult(
        value
    );

    saveToGoogleSheet(
        value
    );

    setStatus(
        "✅ Manual URL Google Sheet me save ho gaya.",
        "success"
    );

    input.value =
        "";

}


/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener(
    "load",
    function(){

        startBtn.disabled =
            false;

        stopBtn.disabled =
            true;

        setStatus(
            "📷 Start Camera dabayein."
        );

    }
);


/* =====================================================
   PAGE CLOSE
===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        try{

            stopScanner();

        }catch(e){}

    }
);

</script>

</body>
</html>
