<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bihar Sand Challan QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  margin:0;
  padding:15px;
  font-family:Arial,sans-serif;
  background:#f5f7f6;
  text-align:center;
}

h1{
  color:#176b3a;
  margin-bottom:5px;
}

#reader{
  width:100%;
  max-width:600px;
  margin:15px auto;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
}

#status{
  max-width:600px;
  margin:15px auto;
  padding:14px;
  border-radius:8px;
  background:#eee;
  font-weight:bold;
}

.success{
  background:#d9f7df !important;
  color:#126b2d;
}

.error{
  background:#ffe0e0 !important;
  color:#a00000;
}

.result{
  max-width:600px;
  margin:15px auto;
  padding:15px;
  background:white;
  border-radius:10px;
  word-break:break-all;
  text-align:left;
}

input{
  width:90%;
  max-width:550px;
  padding:14px;
  font-size:16px;
  border:1px solid #aaa;
  border-radius:8px;
}

button{
  padding:13px 25px;
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#176b3a;
  color:white;
  font-size:16px;
}
</style>
</head>

<body>

<h1>🚚 Bihar Sand Challan</h1>

<div>📷 QR Code Scan Kijiye</div>

<div id="reader"></div>

<div id="status">
Camera start ho raha hai...
</div>

<div id="result" class="result">
QR scan hone ke baad URL yahan dikhega.
</div>

<h3>Ya QR URL manually paste karein</h3>

<input
  id="manualUrl"
  type="text"
  placeholder="QR URL yahan paste karein"
>

<br>

<button onclick="manualSubmit()">
Submit URL
</button>


<script>

/* =========================================
   GOOGLE APPS SCRIPT URL
   ========================================= */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwhAG6me0_QyMPKBTVRu_hpzFkrWXRbHR_1RQgNlGvq3Vx7SHSree91OR0BiCZU5TBN/exec";


/* =========================================
   VARIABLES
   ========================================= */

let html5QrCode = null;

let scanningLocked = false;


/* =========================================
   STATUS
   ========================================= */

function status(text,type=""){

  const box=document.getElementById("status");

  box.className="";

  box.id="status";

  if(type){
    box.classList.add(type);
  }

  box.innerText=text;
}


/* =========================================
   SHOW RESULT
   ========================================= */

function showResult(text){

  const box=document.getElementById("result");

  box.innerHTML=
    "<b>✅ QR Detected</b><br><br>"+
    "<a href=\""+
    encodeURI(text)+
    "\" target=\"_blank\">"+
    text+
    "</a>";
}


/* =========================================
   SAVE TO GOOGLE SHEET
   ========================================= */

function saveToGoogleSheet(url){

  if(
    APPS_SCRIPT_URL.includes("PASTE_YOUR")
  ){

    status(
      "⚠️ QR scan ho gaya. Apps Script URL abhi set nahi hai.",
      "error"
    );

    return;
  }

  const finalUrl =
    APPS_SCRIPT_URL+
    "?url="+
    encodeURIComponent(url);

  fetch(finalUrl,{
    method:"GET",
    mode:"no-cors"
  })
  .then(function(){

    status(
      "✅ QR Scan Successful — Google Sheet me save ho gaya.",
      "success"
    );

  })
  .catch(function(){

    status(
      "⚠️ QR scan hua, Sheet connection check karein.",
      "error"
    );

  });
}


/* =========================================
   QR SUCCESS
   ========================================= */

function onScanSuccess(decodedText,decodedResult){

  if(!decodedText){
    return;
  }

  if(scanningLocked){
    return;
  }

  scanningLocked=true;

  console.log("QR DATA:",decodedText);

  showResult(decodedText);

  status(
    "✅ QR Code Detect Ho Gaya!",
    "success"
  );

  saveToGoogleSheet(decodedText);

  /*
     3 seconds baad next QR allow
  */

  setTimeout(function(){

    scanningLocked=false;

    status(
      "📷 Next QR Code scan kijiye..."
    );

  },3000);
}


/* =========================================
   SCAN ERROR
   ========================================= */

function onScanFailure(error){

  /*
    Normal scanning errors ignore.
  */

}


/* =========================================
   START CAMERA
   ========================================= */

async function startCamera(){

  try{

    html5QrCode =
      new Html5Qrcode("reader");


    const config={

      fps:15,

      qrbox:function(
        viewfinderWidth,
        viewfinderHeight
      ){

        const size =
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          ) * 0.75;

        return {
          width:size,
          height:size
        };

      },

      aspectRatio:1.0,

      disableFlip:false,

      formatsToSupport:[
        Html5QrcodeSupportedFormats.QR_CODE
      ]

    };


    /*
      Back camera first
    */

    await html5QrCode.start(

      {
        facingMode:"environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    status(
      "📷 Camera Ready — QR ko box ke andar rakhein."
    );


  }catch(error){

    console.error(error);

    status(
      "❌ Camera start nahi hua: "+
      error,
      "error"
    );

  }

}


/* =========================================
   MANUAL URL
   ========================================= */

function manualSubmit(){

  const input =
    document.getElementById("manualUrl");

  const url =
    input.value.trim();

  if(!url){

    status(
      "⚠️ URL paste kijiye.",
      "error"
    );

    return;
  }

  showResult(url);

  saveToGoogleSheet(url);

  input.value="";
}


/* =========================================
   START
   ========================================= */

window.addEventListener(
  "load",
  function(){

    startCamera();

  }
);

</script>

</body>
</html>
