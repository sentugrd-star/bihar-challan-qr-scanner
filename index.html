<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bihar Sand Challan QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    padding:15px;
    font-family:Arial,sans-serif;
    background:#f5f7f6;
    text-align:center;
}

h1{
    color:#176b3a;
    margin-bottom:5px;
}

.box{
    max-width:600px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:15px;
}

#reader{
    width:100%;
    max-width:550px;
    margin:15px auto;
}

#status{
    margin:15px 0;
    padding:14px;
    border-radius:8px;
    background:#eeeeee;
    font-weight:bold;
}

.success{
    background:#d9f7df !important;
    color:#126b2d;
}

.error{
    background:#ffe0e0 !important;
    color:#a00000;
}

#result{
    margin:15px 0;
    padding:15px;
    background:#f0f7ff;
    border-radius:10px;
    word-break:break-all;
    text-align:left;
}

input[type="text"]{
    width:95%;
    padding:13px;
    font-size:16px;
    border:1px solid #aaa;
    border-radius:8px;
    box-sizing:border-box;
    margin:8px 0;
}

input[type="file"]{
    width:95%;
    padding:12px;
    margin:10px 0;
}

button{
    padding:13px 22px;
    margin:8px;
    border:0;
    border-radius:8px;
    background:#176b3a;
    color:white;
    font-size:16px;
}

hr{
    margin:25px 0;
    border:0;
    border-top:1px solid #ddd;
}
</style>
</head>

<body>

<div class="box">

<h1>🚚 Bihar Sand Challan</h1>

<p>QR Code Scan Kijiye</p>

<!-- LIVE CAMERA -->
<div id="reader"></div>

<div id="status">
📷 Camera start ho raha hai...
</div>

<!-- RESULT -->
<div id="result">
QR scan hone ke baad URL yahan dikhega.
</div>

<hr>

<!-- PHOTO SCAN -->
<h3>🖼️ QR Photo Se Scan</h3>

<p>
QR ki photo kheechkar yahan select karein
</p>

<input
    type="file"
    id="qrImage"
    accept="image/*"
>

<hr>

<!-- MANUAL URL -->
<h3>🔗 Manual URL</h3>

<input
    type="text"
    id="manualUrl"
    placeholder="QR URL yahan paste karein"
>

<br>

<button onclick="manualSubmit()">
Submit URL
</button>

</div>
