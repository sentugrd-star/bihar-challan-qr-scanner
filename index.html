<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bihar Sand Challan QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    padding:15px;
    font-family:Arial,sans-serif;
    background:#f5f7f6;
    text-align:center;
}

h1{
    color:#176b3a;
    margin-bottom:5px;
}

.box{
    max-width:600px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:15px;
}

#reader{
    width:100%;
    max-width:550px;
    margin:15px auto;
}

#status{
    margin:15px 0;
    padding:14px;
    border-radius:8px;
    background:#eeeeee;
    font-weight:bold;
}

.success{
    background:#d9f7df !important;
    color:#126b2d;
}

.error{
    background:#ffe0e0 !important;
    color:#a00000;
}

#result{
    margin:15px 0;
    padding:15px;
    background:#f0f7ff;
    border-radius:10px;
    word-break:break-all;
    text-align:left;
}

input[type="text"]{
    width:95%;
    padding:13px;
    font-size:16px;
    border:1px solid #aaa;
    border-radius:8px;
    box-sizing:border-box;
    margin:8px 0;
}

input[type="file"]{
    width:95%;
    padding:12px;
    margin:10px 0;
}

button{
    padding:13px 22px;
    margin:8px;
    border:0;
    border-radius:8px;
    background:#176b3a;
    color:white;
    font-size:16px;
}

hr{
    margin:25px 0;
    border:0;
    border-top:1px solid #ddd;
}
</style>
</head>

<body>

<div class="box">

<h1>🚚 Bihar Sand Challan</h1>

<p>QR Code Scan Kijiye</p>

<!-- LIVE CAMERA -->
<div id="reader"></div>

<div id="status">
📷 Camera start ho raha hai...
</div>

<!-- RESULT -->
<div id="result">
QR scan hone ke baad URL yahan dikhega.
</div>

<hr>

<!-- PHOTO SCAN -->
<h3>🖼️ QR Photo Se Scan</h3>

<p>
QR ki photo kheechkar yahan select karein
</p>

<input
    type="file"
    id="qrImage"
    accept="image/*"
>

<hr>

<!-- MANUAL URL -->
<h3>🔗 Manual URL</h3>

<input
    type="text"
    id="manualUrl"
    placeholder="QR URL yahan paste karein"
>

<br>

<button onclick="manualSubmit()">
Submit URL
</button>

</div>


<script>

/* ==========================================
   GOOGLE APPS SCRIPT WEB APP URL
   ========================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwhAG6me0_QyMPKBTVRu_hpzFkrWXRbHR_1RQgNlGvq3Vx7SHSree91OR0BiCZU5TBN/exec";


let scanner = null;
let scanningLocked = false;


/* ==========================================
   STATUS
   ========================================== */

function setStatus(text,type=""){

    const box =
        document.getElementById("status");

    box.className = "";

    box.id = "status";

    if(type){
        box.classList.add(type);
    }

    box.innerText = text;
}


/* ==========================================
   SHOW RESULT
   ========================================== */

function showResult(url){

    const box =
        document.getElementById("result");

    box.innerHTML =
        "<b>✅ QR Data:</b><br><br>" +
        escapeHtml(url);
}


/* ==========================================
   HTML SAFE
   ========================================== */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ==========================================
   SAVE TO GOOGLE SHEET
   ========================================== */

function saveToGoogleSheet(url){

    if(!url){
        return;
    }

    if(
        APPS_SCRIPT_URL.includes("PASTE")
    ){

        setStatus(
            "⚠️ Apps Script URL set nahi hai.",
            "error"
        );

        return;
    }


    const finalURL =
        APPS_SCRIPT_URL +
        "?url=" +
        encodeURIComponent(url);


    const iframe =
        document.createElement("iframe");

    iframe.style.display = "none";

    iframe.src = finalURL;

    document.body.appendChild(iframe);


    setTimeout(function(){

        iframe.remove();

    },10000);
}


/* ==========================================
   QR SUCCESS
   ========================================== */

function onScanSuccess(decodedText){

    if(!decodedText){
        return;
    }

    if(scanningLocked){
        return;
    }

    scanningLocked = true;


    showResult(decodedText);


    setStatus(
        "✅ QR Scan Successful — Google Sheet me save ho raha hai...",
        "success"
    );


    saveToGoogleSheet(decodedText);


    setTimeout(function(){

        scanningLocked = false;

        setStatus(
            "📷 Next QR Code scan kijiye..."
        );

    },3000);
}


/* ==========================================
   CAMERA SCAN
   ========================================== */

function startCamera(){

    scanner =
        new Html5QrcodeScanner(
            "reader",
            {
                fps:15,

                qrbox:{
                    width:280,
                    height:280
                },

                rememberLastUsedCamera:true,

                supportedScanTypes:[
                    Html5QrcodeScanType.SCAN_TYPE_CAMERA,
                    Html5QrcodeScanType.SCAN_TYPE_FILE
                ]
            },
            false
        );


    scanner.render(
        onScanSuccess,
        function(error){
            // Normal scan errors ignore
        }
    );


    setStatus(
        "📷 Camera Ready — QR ko box ke andar rakhein."
    );
}


/* ==========================================
   PHOTO SCAN
   ========================================== */

document
.getElementById("qrImage")
.addEventListener(
    "change",
    function(event){

        const file =
            event.target.files[0];

        if(!file){
            return;
        }


        setStatus(
            "🔍 QR photo scan ho rahi hai..."
        );


        const imageScanner =
            new Html5Qrcode("reader");


        imageScanner
        .scanFile(
            file,
            true
        )
        .then(function(decodedText){

            showResult(decodedText);


            setStatus(
                "✅ Photo se QR successfully read ho gaya!",
                "success"
            );


            saveToGoogleSheet(decodedText);


            imageScanner
            .clear()
            .catch(function(){});

        })
        .catch(function(error){

            setStatus(
                "❌ Photo me QR detect nahi hua. Clear QR photo try karein.",
                "error"
            );


            imageScanner
            .clear()
            .catch(function(){});

        });

    }
);


/* ==========================================
   MANUAL URL
   ========================================== */

function manualSubmit(){

    const url =
        document
        .getElementById("manualUrl")
        .value
        .trim();


    if(!url){

        setStatus(
            "⚠️ QR URL paste kijiye.",
            "error"
        );

        return;
    }


    showResult(url);


    setStatus(
        "✅ URL submit ho raha hai...",
        "success"
    );


    saveToGoogleSheet(url);
}


/* ==========================================
   START
   ========================================== */

window.onload =
    function(){

        startCamera();

    };

</script>

</body>
</html>
