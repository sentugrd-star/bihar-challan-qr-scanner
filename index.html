<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Bihar Sand Challan QR Scanner</title>

<!-- ZXing QR Scanner -->
<script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:12px;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f5f4;
    color:#222;
}

.container{
    width:100%;
    max-width:650px;
    margin:auto;
}

h1{
    text-align:center;
    color:#176b3a;
    font-size:25px;
    margin:8px 0;
}

.subtitle{
    text-align:center;
    color:#555;
    margin-bottom:12px;
    font-size:18px;
}

.camera-box{
    width:100%;
    background:#000;
    border-radius:15px;
    overflow:hidden;
    position:relative;
}

#video{
    display:block;
    width:100%;
    height:390px;
    object-fit:cover;
    background:#000;
}

.scan-frame{
    position:absolute;
    width:65%;
    aspect-ratio:1/1;
    left:17.5%;
    top:50%;
    transform:translateY(-50%);
    border:4px solid #00ff66;
    border-radius:15px;
    pointer-events:none;
}

.status{
    margin:12px 0;
    padding:15px;
    text-align:center;
    border-radius:10px;
    background:#e9eceb;
    font-weight:bold;
    font-size:16px;
    word-break:break-word;
}

.success{
    background:#d9f5df;
    color:#126b2d;
}

.error{
    background:#ffe0e0;
    color:#a00000;
}

.warning{
    background:#fff0c2;
    color:#765700;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin:12px 0;
}

button{
    border:0;
    border-radius:9px;
    padding:14px 20px;
    background:#176b3a;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
}

button.danger{
    background:#a00000;
}

button.secondary{
    background:#555;
}

.card{
    background:white;
    padding:16px;
    margin-top:15px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h3{
    margin-top:0;
    color:#176b3a;
    font-size:21px;
}

#result{
    word-break:break-all;
    line-height:1.5;
    font-size:15px;
}

.open-link{
    display:inline-block;
    margin-top:12px;
    padding:11px 16px;
    background:#176b3a;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

input[type=text]{
    width:100%;
    padding:14px;
    border:1px solid #999;
    border-radius:8px;
    font-size:16px;
}

input[type=file]{
    width:100%;
    padding:8px 0;
}

.small{
    text-align:center;
    color:#777;
    font-size:13px;
    margin:20px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>🚚 Bihar Sand Challan</h1>

<div class="subtitle">
📷 Fast QR Scanner
</div>

<!-- CAMERA -->
<div class="camera-box">

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>

    <div class="scan-frame"></div>

</div>

<!-- STATUS -->
<div id="status" class="status">
    📷 Start Camera dabayein.
</div>

<!-- BUTTONS -->
<div class="controls">

    <button
        id="startBtn"
        onclick="startScanner()">
        ▶️ Start Camera
    </button>

    <button
        id="stopBtn"
        class="danger"
        onclick="stopScanner()"
        disabled>
        ⏹️ Stop
    </button>

    <button
        id="torchBtn"
        class="secondary"
        onclick="toggleTorch()"
        style="display:none">
        🔦 Torch ON
    </button>

</div>

<!-- RESULT -->
<div class="card">

<h3>✅ Scan Result</h3>

<div id="result">
    QR scan hone ke baad URL yahan dikhega.
</div>

</div>

<!-- PHOTO QR -->
<div class="card">

<h3>🖼️ QR Photo Se Scan</h3>

<p>
QR ki clear photo select karein.
</p>

<input
    type="file"
    id="qrImage"
    accept="image/*">

</div>

<!-- MANUAL -->
<div class="card">

<h3>🔗 Manual URL</h3>

<input
    type="text"
    id="manualUrl"
    placeholder="QR URL yahan paste karein">

<div class="controls">

<button onclick="manualSubmit()">
    Submit URL
</button>

</div>

</div>

<div class="small">
Bihar Sand Challan QR Scanner
</div>

</div>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT URL
========================================================= */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwhAG6me0_QyMPKBTVRu_hpzFkrWXRbHR_1RQgNlGvq3Vx7SHSree91OR0BiCZU5TBN/exec";


/* =========================================================
   VARIABLES
========================================================= */

let codeReader = null;
let controls = null;

let scannerRunning = false;
let lastScannedText = "";
let torchOn = false;

let saveQueue = [];
let savingNow = false;

const SAVE_QUEUE_KEY = "bihar_qr_save_queue";


/* =========================================================
   ELEMENTS
========================================================= */

const video =
document.getElementById("video");

const statusBox =
document.getElementById("status");

const resultBox =
document.getElementById("result");

const startBtn =
document.getElementById("startBtn");

const stopBtn =
document.getElementById("stopBtn");

const torchBtn =
document.getElementById("torchBtn");


/* =========================================================
   STATUS
========================================================= */

function setStatus(text,type=""){

    statusBox.className =
        "status " + type;

    statusBox.innerText =
        text;
}


/* =========================================================
   RESULT
========================================================= */

function showResult(text){

    const safe =
        String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");

    let html =
        "<b>QR Data:</b><br><br>" +
        safe;

    if(/^https?:\/\//i.test(text)){

        html +=
            "<br><br>" +
            "<a class='open-link' " +
            "href='" +
            encodeURI(text) +
            "' " +
            "target='_blank'>" +
            "🔗 Open QR Link" +
            "</a>";
    }

    resultBox.innerHTML =
        html;
}


/* =========================================================
   BEEP
========================================================= */

function beep(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext) return;

        const audio =
            new AudioContext();

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();

        oscillator.frequency.value =
            1000;

        gain.gain.value =
            0.08;

        oscillator.connect(gain);

        gain.connect(
            audio.destination
        );

        oscillator.start();

        oscillator.stop(
            audio.currentTime + 0.12
        );

    }catch(e){}
}


/* =========================================================
   VIBRATION
========================================================= */

function vibrate(){

    try{

        if(navigator.vibrate){

            navigator.vibrate(
                [80,40,80]
            );

        }

    }catch(e){}
}


/* =========================================================
   LOAD SAVED QUEUE
========================================================= */

try{

    saveQueue =
        JSON.parse(
            localStorage.getItem(
                SAVE_QUEUE_KEY
            ) || "[]"
        );

}catch(e){

    saveQueue = [];
}


/* =========================================================
   SAVE QUEUE
========================================================= */

function saveQueueStorage(){

    try{

        localStorage.setItem(
            SAVE_QUEUE_KEY,
            JSON.stringify(saveQueue)
        );

    }catch(e){}
}


/* =========================================================
   SAVE TO GOOGLE SHEET
========================================================= */

function saveToGoogleSheet(value){

    if(!value) return;

    saveQueue.push({
        url:value,
        time:new Date().toISOString()
    });

    saveQueueStorage();

    processSaveQueue();
}


/* =========================================================
   PROCESS GOOGLE SHEET QUEUE
========================================================= */

function processSaveQueue(){

    if(savingNow) return;

    if(saveQueue.length === 0) return;

    savingNow = true;

    const item =
        saveQueue[0];

    const url =
        APPS_SCRIPT_URL +
        "?url=" +
        encodeURIComponent(
            item.url
        );

    let completed = false;

    const img =
        new Image();

    function success(){

        if(completed) return;

        completed = true;

        saveQueue.shift();

        saveQueueStorage();

        savingNow = false;

        setStatus(
            "✅ QR Google Sheet me bhej diya gaya.",
            "success"
        );

        setTimeout(
            processSaveQueue,
            300
        );
    }

    img.onload = function(){

        success();

    };

    img.onerror = function(){

        /*
          Google Apps Script redirect ke
          karan kabhi-kabhi onerror aa sakta hai.
          Request server tak pahunch sakti hai.
        */

        setTimeout(function(){

            if(!completed){

                success();

            }

        },1500);

    };

    img.src =
        url;

    /*
      Maximum wait
    */

    setTimeout(function(){

        if(!completed){

            success();

        }

    },5000);
}


/* =========================================================
   QR SUCCESS
========================================================= */

function onQRSuccess(result){

    if(!result) return;

    let text = "";

    /*
      ZXing result object
    */

    if(typeof result === "string"){

        text =
            result.trim();

    }else if(result.text){

        text =
            result.text.trim();

    }

    if(!text) return;


    /*
      Same QR ko baar-baar
      immediately save mat karo.
    */

    if(text === lastScannedText){

        return;
    }

    lastScannedText =
        text;


    /*
      SHOW RESULT
    */

    showResult(text);


    /*
      BEEP
    */

    beep();


    /*
      VIBRATION
    */

    vibrate();


    /*
      GOOGLE SHEET
    */

    saveToGoogleSheet(text);


    /*
      SUCCESS STATUS
    */

    setStatus(
        "✅ QR Scan Successful — Google Sheet me save ho raha hai.",
        "success"
    );


    /*
      1.5 second baad
      same QR dobara scan ho sakta hai
    */

    setTimeout(function(){

        lastScannedText = "";

        if(scannerRunning){

            setStatus(
                "📷 Next QR Code scan kijiye."
            );

        }

    },1500);

}


/* =========================================================
   START CAMERA
========================================================= */

async function startScanner(){

    if(scannerRunning){

        return;
    }

    try{

        if(!window.ZXingBrowser){

            throw new Error(
                "ZXing library load nahi hui."
            );
        }


        /*
          HTTPS check
        */

        if(
            location.protocol !== "https:" &&
            location.hostname !== "localhost"
        ){

            throw new Error(
                "Camera ke liye HTTPS required hai."
            );

        }


        setStatus(
            "📷 Rear camera start ho raha hai..."
        );

        startBtn.disabled =
            true;


        /*
          Reader create
        */

        if(!codeReader){

            codeReader =
                new ZXingBrowser
                .BrowserQRCodeReader();

        }


        /*
          Camera constraints
        */

        const constraints = {

            video:{

                facingMode:{
                    ideal:"environment"
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            },

            audio:false

        };


        /*
          Start ZXing
        */

        controls =
            await codeReader
            .decodeFromConstraints(

                constraints,

                video,

                function(result,error){

                    if(result){

                        onQRSuccess(
                            result
                        );

                    }

                }

            );


        /*
          Video play
        */

        try{

            await video.play();

        }catch(e){}


        scannerRunning =
            true;

        stopBtn.disabled =
            false;


        setStatus(
            "📷 Rear Camera Ready — QR ko green box ke andar rakhein.",
            "success"
        );


        checkTorch();


    }catch(error){

        console.error(
            "CAMERA ERROR:",
            error
        );

        scannerRunning =
            false;

        startBtn.disabled =
            false;

        stopBtn.disabled =
            true;


        let message =
            error &&
            error.message
            ? error.message
            : String(error);


        setStatus(
            "❌ Camera start nahi hua: " +
            message,
            "error"
        );

    }

}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopScanner(){

    try{

        if(
            controls &&
            typeof controls.stop ===
            "function"
        ){

            controls.stop();

        }

    }catch(e){

        console.error(e);

    }


    try{

        if(codeReader){

            codeReader.reset();

        }

    }catch(e){}


    try{

        if(video.srcObject){

            video.srcObject
                .getTracks()
                .forEach(function(track){

                    track.stop();

                });

            video.srcObject =
                null;
        }

    }catch(e){}


    controls =
        null;

    scannerRunning =
        false;

    torchOn =
        false;

    startBtn.disabled =
        false;

    stopBtn.disabled =
        true;

    torchBtn.style.display =
        "none";

    setStatus(
        "⏹️ Camera stopped."
    );
}


/* =========================================================
   TORCH CHECK
========================================================= */

function checkTorch(){

    try{

        const stream =
            video.srcObject;

        if(!stream) return;

        const track =
            stream.getVideoTracks()[0];

        if(!track) return;

        const capabilities =
            track.getCapabilities();

        if(
            capabilities &&
            capabilities.torch
        ){

            torchBtn.style.display =
                "inline-block";
        }

    }catch(e){}
}


/* =========================================================
   TORCH
========================================================= */

async function toggleTorch(){

    try{

        const stream =
            video.srcObject;

        if(!stream) return;

        const track =
            stream.getVideoTracks()[0];

        if(!track) return;

        const capabilities =
            track.getCapabilities();

        if(
            !capabilities ||
            !capabilities.torch
        ){

            setStatus(
                "⚠️ Is camera me Torch support nahi hai.",
                "warning"
            );

            return;
        }

        torchOn =
            !torchOn;

        await track.applyConstraints({

            advanced:[
                {
                    torch:
                        torchOn
                }
            ]

        });

        torchBtn.innerText =
            torchOn
            ? "🔦 Torch OFF"
            : "🔦 Torch ON";

    }catch(error){

        console.error(
            "Torch error:",
            error
        );

        torchOn =
            false;

        setStatus(
            "⚠️ Torch support nahi hai.",
            "warning"
        );

    }

}


/* =========================================================
   QR PHOTO SCANNER
========================================================= */

document
.getElementById("qrImage")
.addEventListener(
    "change",
    async function(event){

        const file =
            event.target.files[0];

        if(!file) return;

        setStatus(
            "🔍 Photo se QR scan ho raha hai..."
        );

        try{

            if(!window.ZXingBrowser){

                throw new Error(
                    "ZXing library load nahi hui."
                );

            }

            if(!codeReader){

                codeReader =
                    new ZXingBrowser
                    .BrowserQRCodeReader();

            }

            const imageURL =
                URL.createObjectURL(
                    file
                );

            const result =
                await codeReader
                .decodeFromImageUrl(
                    imageURL
                );

            URL.revokeObjectURL(
                imageURL
            );

            if(result){

                onQRSuccess(
                    result
                );

            }else{

                throw new Error(
                    "QR detect nahi hua."
                );
            }

        }catch(error){

            console.error(
                "PHOTO QR ERROR:",
                error
            );

            setStatus(
                "❌ Photo me QR detect nahi hua. Clear photo try karein.",
                "error"
            );

        }

    }
);


/* =========================================================
   MANUAL URL
========================================================= */

function manualSubmit(){

    const input =
        document.getElementById(
            "manualUrl"
        );

    const value =
        input.value.trim();

    if(!value){

        setStatus(
            "⚠️ QR URL paste kijiye.",
            "warning"
        );

        return;
    }

    showResult(
        value
    );

    saveToGoogleSheet(
        value
    );

    setStatus(
        "✅ Manual URL Google Sheet me save ho raha hai.",
        "success"
    );

    input.value =
        "";
}


/* =========================================================
   PAGE LOAD
========================================================= */

window.addEventListener(
    "load",
    function(){

        startBtn.disabled =
            false;

        stopBtn.disabled =
            true;

        setStatus(
            "📷 Start Camera dabayein."
        );

        /*
          Pending QR save retry
        */

        setTimeout(
            processSaveQueue,
            1000
        );

    }
);


/* =========================================================
   PAGE CLOSE
========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        try{

            stopScanner();

        }catch(e){}

    }
);

</script>

</body>
</html>
