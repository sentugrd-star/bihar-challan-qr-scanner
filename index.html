<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bihar Sand Challan QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #1b5e20;
      font-size: 25px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
      background: white;
      padding: 15px;
      border-radius: 12px;
    }

    input {
      width: 90%;
      max-width: 500px;
      padding: 12px;
      font-size: 15px;
      margin: 10px;
      box-sizing: border-box;
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      background: #1b5e20;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #2e7d32;
    }

    #result {
      max-width: 600px;
      margin: 15px auto;
      padding: 12px;
      background: white;
      border-radius: 8px;
      word-break: break-all;
    }

    #status {
      font-weight: bold;
      margin: 15px;
    }

    iframe {
      display: none;
    }
  </style>
</head>

<body>

  <h1>🚚 Bihar Sand Challan</h1>
  <p>QR Code Scan Kijiye</p>

  <div id="reader"></div>

  <div id="status">
    Camera start ho raha hai...
  </div>

  <div id="result">
    QR scan hone ke baad URL yahan dikhega.
  </div>

  <input
    type="text"
    id="manualUrl"
    placeholder="QR URL yahan bhi paste kar sakte hain"
  >

  <br>

  <button onclick="submitManual()">
    Submit URL
  </button>

  <!-- Google Apps Script ko background mein request bhejne ke liye -->
  <iframe name="sheetFrame"></iframe>

  <form
    id="sheetForm"
    method="GET"
    target="sheetFrame"
    style="display:none;"
  >
    <input type="hidden" name="url" id="sheetUrl">
  </form>


<script>

  /*
    IMPORTANT:
    Ye aapka Google Apps Script Web App URL hai.
  */
  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbwhAG6me0_QyMPKBTVRu_hpzFkrWXRbHR_1RQgNIGvq3Vx7SHSree91OR0BICZU5TBN/exec";


  let alreadyScanned = false;


  function onScanSuccess(decodedText, decodedResult) {

    if (alreadyScanned) {
      return;
    }

    alreadyScanned = true;

    document.getElementById("status").innerText =
      "✅ QR Scan Successful";

    document.getElementById("result").innerText =
      decodedText;

    saveToGoogleSheet(decodedText);

    setTimeout(function() {
      alreadyScanned = false;
    }, 3000);
  }


  function onScanFailure(error) {
    // Normal scanning errors ko ignore karein
  }


  function startScanner() {

    const html5QrCode = new Html5Qrcode("reader");

    html5QrCode.start(
      { facingMode: "environment" },

      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

      onScanSuccess,
      onScanFailure

    ).then(function() {

      document.getElementById("status").innerText =
        "📷 Camera Ready — QR Code Scan Kijiye";

    }).catch(function(error) {

      document.getElementById("status").innerText =
        "❌ Camera Permission/Error: " + error;

    });
  }


  function saveToGoogleSheet(url) {

    document.getElementById("sheetUrl").value = url;

    document.getElementById("sheetForm").action =
      APPS_SCRIPT_URL;

    document.getElementById("sheetForm").submit();

    document.getElementById("status").innerText =
      "✅ QR Saved to Google Sheet";
  }


  function submitManual() {

    const url =
      document.getElementById("manualUrl").value.trim();

    if (!url) {
      alert("Please QR URL enter karein.");
      return;
    }

    document.getElementById("result").innerText = url;

    saveToGoogleSheet(url);
  }


  window.onload = function() {
    startScanner();
  };

</script>

</body>
</html>
