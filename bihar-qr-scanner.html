<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Bihar Sand Challan QR Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:12px;
    font-family:Arial,sans-serif;
    background:#f3f5f4;
}

.container{
    max-width:650px;
    margin:auto;
}

h1{
    text-align:center;
    color:#176b3a;
    margin:8px 0;
}

.subtitle{
    text-align:center;
    color:#555;
    margin-bottom:12px;
}

#reader{
    width:100%;
    background:#000;
    border-radius:15px;
    overflow:hidden;
}

#reader video{
    width:100%!important;
    height:auto!important;
    object-fit:cover;
}

.status{
    margin:12px 0;
    padding:14px;
    text-align:center;
    border-radius:9px;
    background:#e9eceb;
    font-weight:bold;
}

.success{
    background:#d9f5df;
    color:#126b2d;
}

.error{
    background:#ffe0e0;
    color:#a00000;
}

.controls{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin:12px 0;
}

button{
    border:0;
    border-radius:8px;
    padding:13px 20px;
    background:#176b3a;
    color:white;
    font-size:16px;
}

button.danger{
    background:#a00000;
}

button.secondary{
    background:#555;
}

button:disabled{
    opacity:.5;
}

.card{
    background:white;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

#result{
    word-break:break-all;
    line-height:1.5;
}

.open-link{
    display:inline-block;
    margin-top:12px;
    padding:10px 15px;
    background:#176b3a;
    color:white;
    text-decoration:none;
    border-radius:7px;
}

input[type=text]{
    width:100%;
    padding:13px;
    border:1px solid #999;
    border-radius:8px;
    font-size:16px;
}

input[type=file]{
    width:100%;
    margin-top:8px;
}

.small{
    text-align:center;
    color:#777;
    margin:18px 0;
    font-size:13px;
}

</style>

</head>

<body>

<div class="container">

<h1>🚚 Bihar Sand Challan</h1>

<div class="subtitle">
📷 Fast QR Scanner
</div>


<!-- CAMERA -->

<div id="reader"></div>


<!-- STATUS -->

<div id="status" class="status">
📷 Start Camera dabayein.
</div>


<div class="controls">

<button
    id="startBtn"
    onclick="startCamera()">

▶️ Start Camera

</button>


<button
    id="stopBtn"
    class="danger"
    onclick="stopCamera()"
    disabled>

⏹️ Stop

</button>


<button
    id="torchBtn"
    class="secondary"
    onclick="toggleTorch()"
    style="display:none">

🔦 Torch

</button>

</div>


<!-- RESULT -->

<div class="card">

<h3>✅ Scan Result</h3>

<div id="result">

QR scan hone ke baad URL yahan dikhega.

</div>

</div>


<!-- PHOTO -->

<div class="card">

<h3>🖼️ QR Photo Se Scan</h3>

<input
    type="file"
    id="qrImage"
    accept="image/*">

</div>


<!-- MANUAL -->

<div class="card">

<h3>🔗 Manual URL</h3>

<input
    type="text"
    id="manualUrl"
    placeholder="QR URL yahan paste karein">

<div class="controls">

<button onclick="manualSubmit()">

Submit URL

</button>

</div>

</div>


<div class="small">

Bihar Sand Challan QR Scanner

</div>

</div>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT URL
   ===================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwhAG6me0_QyMPKBTVRu_hpzFkrWXRbHR_1RQgNIGvq3Vx7SHSree91OR0BICZU5TBN/exec";


/* =====================================================
   VARIABLES
   ===================================================== */

let scanner = null;

let scannerRunning = false;

let torchOn = false;

let scanLocked = false;

let lastQR = "";

let lastScanTime = 0;


/* =====================================================
   STATUS
   ===================================================== */

function setStatus(text,type=""){

    const box =
        document.getElementById("status");

    box.className =
        "status " + type;

    box.innerText =
        text;

}


/* =====================================================
   SHOW RESULT
   ===================================================== */

function showResult(text){

    const safe =
        String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");


    let html =
        "<b>QR Data:</b><br><br>" +
        safe;


    if(
        /^https?:\/\//i.test(text)
    ){

        html +=
            "<br><br>" +

            "<a class='open-link' " +

            "href='" +
            encodeURI(text) +
            "' " +

            "target='_blank'>" +

            "🔗 Open QR Link" +

            "</a>";

    }


    document.getElementById(
        "result"
    ).innerHTML = html;

}


/* =====================================================
   BEEP
   ===================================================== */

function beep(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext) return;


        const audio =
            new AudioContext();

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();


        oscillator.frequency.value =
            1000;

        gain.gain.value =
            0.08;


        oscillator.connect(gain);

        gain.connect(
            audio.destination
        );


        oscillator.start();

        oscillator.stop(
            audio.currentTime + 0.12
        );

    }catch(e){}

}


/* =====================================================
   VIBRATION
   ===================================================== */

function vibrate(){

    try{

        if(
            navigator.vibrate
        ){

            navigator.vibrate(
                [80,40,80]
            );

        }

    }catch(e){}

}


/* =====================================================
   GOOGLE SHEET
   ===================================================== */

function saveToGoogleSheet(value){

    if(!value) return;


    const url =
        APPS_SCRIPT_URL +
        "?url=" +
        encodeURIComponent(value);


    /*
       Image request:
       CORS problem nahi aayega.
    */

    const img =
        document.createElement("img");


    img.style.display =
        "none";


    img.src =
        url;


    document.body.appendChild(
        img
    );


    setTimeout(
        function(){

            try{
                img.remove();
            }catch(e){}

        },
        5000
    );

}


/* =====================================================
   QR SUCCESS
   ===================================================== */

function onScanSuccess(decodedText){

    if(!decodedText){

        return;

    }


    if(scanLocked){

        return;

    }


    const now =
        Date.now();


    /*
       Same QR ko 5 second ke
       andar dobara save nahi karega.
    */

    if(
        decodedText === lastQR &&
        now - lastScanTime < 5000
    ){

        return;

    }


    scanLocked = true;

    lastQR =
        decodedText;

    lastScanTime =
        now;


    beep();

    vibrate();


    showResult(
        decodedText
    );


    setStatus(
        "✅ QR Scan Successful — Google Sheet me save ho raha hai.",
        "success"
    );


    saveToGoogleSheet(
        decodedText
    );


    /*
       Camera chalta rahega.
    */

    setTimeout(
        function(){

            scanLocked = false;

            setStatus(
                "📷 Next QR Code scan kijiye."
            );

        },
        1200
    );

}


/* =====================================================
   NORMAL SCAN FAILURE
   ===================================================== */

function onScanFailure(error){

    /*
       QR na milna normal hai.
       Error screen par nahi dikhayenge.
    */

}


/* =====================================================
   SCANNER CONFIG
   ===================================================== */

function getConfig(){

    return {

        /*
           Fast but stable
        */

        fps:15,


        /*
           Large scanning area
        */

        qrbox:function(
            width,
            height
        ){

            const size =
                Math.floor(
                    Math.min(
                        width,
                        height
                    ) * 0.65
                );


            return {

                width:
                    Math.min(
                        380,
                        Math.max(
                            220,
                            size
                        )
                    ),

                height:
                    Math.min(
                        380,
                        Math.max(
                            220,
                            size
                        )
                    )

            };

        },


        /*
           QR only
        */

        formatsToSupport:[
            Html5QrcodeSupportedFormats.QR_CODE
        ],


        disableFlip:true

    };

}


/* =====================================================
   START CAMERA
   ===================================================== */

async function startCamera(){

    if(
        scannerRunning
    ){

        return;

    }


    try{

        setStatus(
            "📷 Rear camera start ho raha hai..."
        );


        /*
           Scanner create
        */

        if(!scanner){

            scanner =
                new Html5Qrcode(
                    "reader"
                );

        }


        /*
           DIRECT REAR CAMERA
        */

        await scanner.start(

            {
                facingMode:"environment"
            },

            getConfig(),

            onScanSuccess,

            onScanFailure

        );


        scannerRunning =
            true;


        document.getElementById(
            "startBtn"
        ).disabled = true;


        document.getElementById(
            "stopBtn"
        ).disabled = false;


        setStatus(
            "📷 Rear Camera Ready — QR ko box ke andar rakhein."
        );


        checkTorch();


    }catch(error){

        console.error(
            "Camera error:",
            error
        );


        scannerRunning =
            false;


        document.getElementById(
            "startBtn"
        ).disabled = false;


        document.getElementById(
            "stopBtn"
        ).disabled = true;


        setStatus(
            "❌ Rear camera start nahi hua. Camera Permission Allow karein.",
            "error"
        );

    }

}


/* =====================================================
   STOP CAMERA
   ===================================================== */

async function stopCamera(){

    try{

        if(
            scanner &&
            scannerRunning
        ){

            await scanner.stop();

        }

    }catch(error){

        console.error(error);

    }


    scannerRunning =
        false;

    torchOn =
        false;


    document.getElementById(
        "startBtn"
    ).disabled = false;


    document.getElementById(
        "stopBtn"
    ).disabled = true;


    document.getElementById(
        "torchBtn"
    ).style.display = "none";


    setStatus(
        "⏹️ Camera stopped."
    );

}


/* =====================================================
   TORCH
   ===================================================== */

function checkTorch(){

    try{

        const capabilities =
            scanner.getRunningTrackCapabilities();


        if(
            capabilities &&
            capabilities.torch
        ){

            document.getElementById(
                "torchBtn"
            ).style.display =
                "inline-block";

        }

    }catch(e){}

}


async function toggleTorch(){

    if(
        !scanner ||
        !scannerRunning
    ){

        return;

    }


    try{

        torchOn =
            !torchOn;


        await scanner.applyVideoConstraints({

            advanced:[
                {
                    torch:
                        torchOn
                }
            ]

        });


        document.getElementById(
            "torchBtn"
        ).innerText =

            torchOn
            ? "🔦 Torch OFF"
            : "🔦 Torch ON";


    }catch(error){

        console.error(error);

        torchOn = false;


        setStatus(
            "⚠️ Is phone camera me Torch support nahi hai."
        );

    }

}


/* =====================================================
   PHOTO QR SCAN
   ===================================================== */

document
.getElementById("qrImage")
.addEventListener(
    "change",
    async function(event){

        const file =
            event.target.files[0];


        if(!file){

            return;

        }


        setStatus(
            "🔍 QR photo scan ho rahi hai..."
        );


        try{

            const imageScanner =
                new Html5Qrcode(
                    "reader"
                );


            const decodedText =
                await imageScanner.scanFile(
                    file,
                    true
                );


            showResult(
                decodedText
            );


            beep();

            vibrate();


            saveToGoogleSheet(
                decodedText
            );


            setStatus(
                "✅ Photo se QR successfully scan ho gaya.",
                "success"
            );


            try{

                await imageScanner.clear();

            }catch(e){}


        }catch(error){

            console.error(
                error
            );


            setStatus(
                "❌ Photo me QR detect nahi hua. Clear QR photo try karein.",
                "error"
            );

        }

    }
);


/* =====================================================
   MANUAL URL
   ===================================================== */

function manualSubmit(){

    const input =
        document.getElementById(
            "manualUrl"
        );


    const value =
        input.value.trim();


    if(!value){

        setStatus(
            "⚠️ QR URL paste kijiye."
        );

        return;

    }


    showResult(
        value
    );


    saveToGoogleSheet(
        value
    );


    setStatus(
        "✅ Manual URL Google Sheet me save ho gaya.",
        "success"
    );


    input.value =
        "";

}


/* =====================================================
   PAGE LOAD
   ===================================================== */

window.addEventListener(
    "load",
    function(){

        document.getElementById(
            "stopBtn"
        ).disabled = true;


        setStatus(
            "📷 Start Camera dabayein."
        );

    }
);


/* =====================================================
   PAGE CLOSE
   ===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        if(
            scanner &&
            scannerRunning
        ){

            scanner.stop()
                .catch(
                    function(){}
                );

        }

    }
);

</script>

</body>
</html>
